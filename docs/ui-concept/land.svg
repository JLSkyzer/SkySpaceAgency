<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Bahnschrift, Segoe UI, Arial, sans-serif">
  <!-- SkySpaceAgency UI concept, Land tab: landing plan, descent profile with heating, safety
       panel (heat, Δv, touchdown), phase timeline. Same window as lift.svg. -->
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111c44"/><stop offset="1" stop-color="#080e26"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#d08a20"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#3a2430"/></linearGradient>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7fe7ff"/><stop offset="0.6" stop-color="#e8a93a"/><stop offset="1" stop-color="#ff5a3a"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#050816"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#win)" stroke="#24366e" stroke-width="2"/>

  <!-- header -->
  <circle cx="62" cy="62" r="24" fill="#0a1230" stroke="url(#gold)" stroke-width="4"/>
  <path d="M 58 76 L 58 54 Q 62 42 66 54 L 66 76 Z" fill="#ffffff"/>
  <path d="M 46 70 A 22 8 -15 0 0 80 60" fill="none" stroke="#e8a93a" stroke-width="3"/>
  <text x="100" y="58" font-size="24" font-weight="700" fill="#f4f7ff" letter-spacing="2">SKYSPACEAGENCY</text>
  <text x="100" y="80" font-size="14" fill="#8ea3d6" letter-spacing="1">FLY FURTHER</text>
  <g font-size="15">
    <rect x="520" y="44" width="230" height="36" rx="18" fill="#17245a"/><circle cx="542" cy="62" r="6" fill="#d6f53c"/>
    <text x="556" y="67" fill="#f4f7ff">Duna Lander I</text>
    <rect x="762" y="44" width="200" height="36" rx="18" fill="#17245a"/>
    <text x="782" y="67" fill="#8ea3d6">Duna · <tspan fill="#f4f7ff">Orbit 120 km</tspan></text>
    <rect x="974" y="44" width="170" height="36" rx="18" fill="#17245a"/>
    <text x="994" y="67" fill="#8ea3d6">Δv <tspan fill="#f4f7ff">1 640 m/s</tspan></text>
    <rect x="1156" y="44" width="170" height="36" rx="18" fill="#17245a"/>
    <text x="1176" y="67" fill="#8ea3d6">TWR <tspan fill="#f4f7ff">3.1 local</tspan></text>
  </g>
  <rect x="1470" y="48" width="28" height="28" rx="6" fill="#17245a"/><path d="M 1477 62 h 14" stroke="#8ea3d6" stroke-width="2.5"/>
  <rect x="1508" y="48" width="28" height="28" rx="6" fill="#17245a"/><path d="M 1515 55 l 14 14 M 1529 55 l -14 14" stroke="#8ea3d6" stroke-width="2.5"/>

  <!-- tab bar -->
  <g font-size="17" font-weight="600" letter-spacing="1">
    <rect x="40" y="104" width="1520" height="52" rx="12" fill="#0c1538"/>
    <rect x="698" y="110" width="150" height="40" rx="9" fill="#1d2c66"/>
    <rect x="698" y="146" width="150" height="4" rx="2" fill="url(#gold)"/>
    <text x="123" y="137" text-anchor="middle" fill="#8ea3d6">LIFT</text>
    <text x="283" y="137" text-anchor="middle" fill="#8ea3d6">ORBIT</text>
    <text x="443" y="137" text-anchor="middle" fill="#8ea3d6">TRANSFER</text>
    <text x="613" y="137" text-anchor="middle" fill="#8ea3d6">RENDEZVOUS</text>
    <text x="773" y="137" text-anchor="middle" fill="#ffe29a">LAND</text>
    <text x="913" y="137" text-anchor="middle" fill="#8ea3d6">RETURN</text>
    <text x="1053" y="137" text-anchor="middle" fill="#8ea3d6">NODES</text>
    <text x="1500" y="137" text-anchor="end" fill="#5c6ea6" font-weight="400">SETTINGS</text>
  </g>

  <!-- left: landing plan -->
  <rect x="40" y="172" width="400" height="508" rx="14" fill="#0e1840" stroke="#1f2f66"/>
  <text x="64" y="208" font-size="14" fill="#8ea3d6" letter-spacing="2">LANDING PLAN</text>
  <g font-size="15">
    <rect x="64" y="224" width="352" height="40" rx="10" fill="#0a1230"/>
    <rect x="68" y="228" width="172" height="32" rx="8" fill="#1d2c66"/>
    <text x="154" y="249" text-anchor="middle" fill="#ffe29a">Propulsive</text>
    <text x="328" y="249" text-anchor="middle" fill="#8ea3d6">Parachutes</text>
  </g>
  <text x="64" y="300" font-size="14" fill="#8ea3d6">Target</text>
  <rect x="64" y="310" width="352" height="64" rx="12" fill="#0a1230" stroke="#e8a93a"/>
  <g fill="none" stroke="#ffe29a" stroke-width="3"><circle cx="96" cy="342" r="11"/><line x1="78" y1="342" x2="114" y2="342"/><line x1="96" y1="324" x2="96" y2="360"/></g>
  <text x="126" y="337" font-size="16" fill="#f4f7ff">Duna base site</text>
  <text x="126" y="359" font-size="13" fill="#8ea3d6">17.42° N · 88.10° W · waypoint</text>
  <g font-size="14">
    <rect x="64" y="384" width="112" height="36" rx="9" fill="#17245a"/><text x="120" y="407" text-anchor="middle" fill="#f4f7ff">Pick on map</text>
    <rect x="184" y="384" width="112" height="36" rx="9" fill="#17245a"/><text x="240" y="407" text-anchor="middle" fill="#f4f7ff">Here</text>
    <rect x="304" y="384" width="112" height="36" rx="9" fill="#17245a"/><text x="360" y="407" text-anchor="middle" fill="#f4f7ff">Coordinates</text>
  </g>
  <text x="64" y="456" font-size="14" fill="#8ea3d6">Land with stage</text>
  <rect x="64" y="466" width="352" height="44" rx="10" fill="#0a1230" stroke="#24366e"/>
  <text x="80" y="494" font-size="16" fill="#f4f7ff">Stage 2 · brake with stage 1 first</text>
  <path d="M 394 484 l 8 8 l 8 -8" fill="none" stroke="#8ea3d6" stroke-width="2.5"/>
  <g font-size="15" fill="#f4f7ff">
    <text x="64" y="560">Precision landing</text>
    <rect x="356" y="544" width="60" height="28" rx="14" fill="#d6f53c"/><circle cx="402" cy="558" r="11" fill="#0a1230"/>
    <text x="64" y="604">Deploy legs early</text>
    <rect x="356" y="588" width="60" height="28" rx="14" fill="#1d2c66"/><circle cx="370" cy="602" r="11" fill="#5c6ea6"/>
    <text x="64" y="648">Heat guard</text>
    <rect x="356" y="632" width="60" height="28" rx="14" fill="#d6f53c"/><circle cx="402" cy="646" r="11" fill="#0a1230"/>
  </g>

  <!-- centre: descent profile -->
  <rect x="456" y="172" width="704" height="508" rx="14" fill="url(#sky)" stroke="#1f2f66"/>
  <text x="480" y="208" font-size="14" fill="#8ea3d6" letter-spacing="2">DESCENT PROFILE</text>
  <text x="1136" y="208" font-size="13" fill="#5c6ea6" text-anchor="end">predicted with drag and heating</text>
  <rect x="480" y="360" width="656" height="250" fill="#ff7a5a" opacity="0.05"/>
  <line x1="480" y1="360" x2="1136" y2="360" stroke="#ff7a5a" stroke-opacity="0.5" stroke-dasharray="8 8"/>
  <text x="1130" y="352" font-size="12" text-anchor="end" fill="#ff9a7a">atmosphere 50 km</text>
  <path d="M 708 380 C 760 410, 800 440, 850 478" fill="none" stroke="#ff7a5a" stroke-width="16" stroke-opacity="0.3" stroke-linecap="round"/>
  <text x="800" y="414" font-size="12" fill="#ff9a7a">peak heating · 61 %</text>
  <path d="M 490 250 C 560 258, 640 318, 700 372 C 780 440, 900 522, 1040 600" fill="none" stroke="#7fe7ff" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M 490 250 C 520 252, 545 258, 570 266" fill="none" stroke="#ffe29a" stroke-width="5"/>
  <g font-size="12">
    <circle cx="570" cy="266" r="9" fill="#4fa8ff"/><text x="556" y="246" fill="#8fd3ff">Deorbit · 68 m/s</text>
    <circle cx="672" cy="347" r="8" fill="#e8a93a"/><text x="600" y="330" fill="#ffe29a">Pre-brake · 140 m/s</text>
    <circle cx="900" cy="520" r="8" fill="#8ea3d6"/><text x="912" y="512" fill="#c4d0ef">Drop stage 1 · 2.4 km</text>
    <circle cx="968" cy="560" r="8" fill="#e8a93a"/><text x="980" y="556" fill="#ffe29a">Brake</text>
  </g>
  <rect x="480" y="610" width="656" height="4" fill="#b5543a"/>
  <g transform="translate(1040 604)" fill="none" stroke="#ffe29a" stroke-width="3"><circle r="12"/><line x1="-20" y1="0" x2="20" y2="0"/><line x1="0" y1="-20" x2="0" y2="8"/></g>
  <text x="1040" y="648" font-size="12" text-anchor="middle" fill="#ffe29a">target · predicted 0.4 km off</text>

  <!-- right: safety -->
  <rect x="1176" y="172" width="384" height="508" rx="14" fill="#0e1840" stroke="#1f2f66"/>
  <text x="1200" y="208" font-size="14" fill="#8ea3d6" letter-spacing="2">SAFETY</text>
  <text x="1200" y="242" font-size="14" fill="#f4f7ff">Hottest part · LV-T45 engine</text>
  <rect x="1200" y="254" width="336" height="16" rx="8" fill="#1d2c66"/>
  <rect x="1200" y="254" width="205" height="16" rx="8" fill="url(#heat)"/>
  <line x1="1452" y1="248" x2="1452" y2="276" stroke="#ff9a7a" stroke-width="2"/><text x="1452" y="294" font-size="11" text-anchor="middle" fill="#ff9a7a">75 % guard</text>
  <line x1="1502" y1="248" x2="1502" y2="276" stroke="#ff5a5a" stroke-width="2"/><text x="1510" y="294" font-size="11" text-anchor="middle" fill="#ff7a7a">90 %</text>
  <text x="1200" y="320" font-size="13" fill="#8ea3d6">Predicted peak 61 % · now 22 %</text>
  <g font-size="13" fill="#8ea3d6">
    <rect x="1200" y="340" width="160" height="92" rx="12" fill="#0a1230"/>
    <text x="1216" y="366">Δv NEEDED</text><text x="1216" y="408" font-size="30" font-weight="600" fill="#f4f7ff">1 122</text>
    <rect x="1376" y="340" width="160" height="92" rx="12" fill="#0a1230"/>
    <text x="1392" y="366">Δv ON BOARD</text><text x="1392" y="408" font-size="30" font-weight="600" fill="#d6f53c">1 640</text>
    <rect x="1200" y="444" width="160" height="92" rx="12" fill="#0a1230"/>
    <text x="1216" y="470">TOUCHDOWN</text><text x="1216" y="512" font-size="30" font-weight="600" fill="#f4f7ff">2.0</text><text x="1272" y="512" fill="#5c6ea6">m/s</text>
    <rect x="1376" y="444" width="160" height="92" rx="12" fill="#0a1230"/>
    <text x="1392" y="470">TIME TO IMPACT</text><text x="1392" y="512" font-size="30" font-weight="600" fill="#f4f7ff">6:41</text>
  </g>
  <rect x="1200" y="614" width="336" height="44" rx="10" fill="#132a1e" stroke="#3d6b2a"/>
  <circle cx="1222" cy="636" r="6" fill="#d6f53c"/>
  <text x="1238" y="641" font-size="14" fill="#d6f53c">Landing feasible · 46 % Δv margin</text>

  <!-- phase timeline -->
  <rect x="40" y="696" width="1520" height="80" rx="14" fill="#0e1840" stroke="#1f2f66"/>
  <line x1="120" y1="726" x2="1480" y2="726" stroke="#1d2c66" stroke-width="4"/>
  <line x1="120" y1="726" x2="390" y2="726" stroke="url(#gold)" stroke-width="4"/>
  <g font-size="14">
    <circle cx="120" cy="726" r="12" fill="#e8a93a"/><text x="120" y="760" text-anchor="middle" fill="#ffe29a">Deorbit</text>
    <circle cx="390" cy="726" r="15" fill="#0a1230" stroke="#ffe29a" stroke-width="4"/><circle cx="390" cy="726" r="6" fill="#ffe29a"/>
    <text x="390" y="760" text-anchor="middle" fill="#f4f7ff" font-weight="700">Pre-brake</text>
    <circle cx="660" cy="726" r="12" fill="#1d2c66"/><text x="660" y="760" text-anchor="middle" fill="#8ea3d6">Atmospheric coast</text>
    <circle cx="930" cy="726" r="12" fill="#1d2c66"/><text x="930" y="760" text-anchor="middle" fill="#8ea3d6">Drop stage 1</text>
    <circle cx="1200" cy="726" r="12" fill="#1d2c66"/><text x="1200" y="760" text-anchor="middle" fill="#8ea3d6">Brake</text>
    <circle cx="1480" cy="726" r="12" fill="#1d2c66"/><text x="1480" y="760" text-anchor="middle" fill="#8ea3d6">Touch down</text>
  </g>

  <!-- action bar -->
  <g font-size="17" font-weight="600">
    <text x="48" y="832" font-size="14" font-weight="400" fill="#8ea3d6">The pre-brake keeps the engines under 70 % of their max temperature</text>
    <rect x="1246" y="800" width="150" height="52" rx="12" fill="#3a1a1a" stroke="#7a3030"/>
    <text x="1321" y="832" text-anchor="middle" fill="#ff9a7a">Abort</text>
    <rect x="1412" y="800" width="148" height="52" rx="12" fill="url(#gold)"/>
    <text x="1486" y="832" text-anchor="middle" fill="#1a1205">Landing…</text>
  </g>
</svg>
