<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Bahnschrift, Segoe UI, Arial, sans-serif">
  <!-- SkySpaceAgency UI concept, Lift tab. Wide app-style window: tab bar on top, three columns
       (plan / view / telemetry), horizontal phase timeline and action bar at the bottom. -->
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111c44"/><stop offset="1" stop-color="#080e26"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#d08a20"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230"/><stop offset="1" stop-color="#13306a"/></linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe7ff" stop-opacity="0.35"/><stop offset="1" stop-color="#7fe7ff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#050816"/>
  <rect x="20" y="20" width="1560" height="860" rx="18" fill="url(#win)" stroke="#24366e" stroke-width="2"/>

  <!-- header -->
  <g>
    <circle cx="62" cy="62" r="24" fill="#0a1230" stroke="url(#gold)" stroke-width="4"/>
    <path d="M 58 76 L 58 54 Q 62 42 66 54 L 66 76 Z" fill="#ffffff"/>
    <path d="M 46 70 A 22 8 -15 0 0 80 60" fill="none" stroke="#e8a93a" stroke-width="3"/>
    <text x="100" y="58" font-size="24" font-weight="700" fill="#f4f7ff" letter-spacing="2">SKYSPACEAGENCY</text>
    <text x="100" y="80" font-size="14" fill="#8ea3d6" letter-spacing="1">FLY FURTHER</text>
    <g font-size="15">
      <rect x="520" y="44" width="230" height="36" rx="18" fill="#17245a"/>
      <circle cx="542" cy="62" r="6" fill="#d6f53c"/>
      <text x="556" y="67" fill="#f4f7ff">Kerbal Explorer II</text>
      <rect x="762" y="44" width="150" height="36" rx="18" fill="#17245a"/>
      <text x="782" y="67" fill="#8ea3d6">Kerbin · <tspan fill="#f4f7ff">Pad</tspan></text>
      <rect x="924" y="44" width="170" height="36" rx="18" fill="#17245a"/>
      <text x="944" y="67" fill="#8ea3d6">Δv <tspan fill="#f4f7ff">4 812 m/s</tspan></text>
      <rect x="1106" y="44" width="150" height="36" rx="18" fill="#17245a"/>
      <text x="1126" y="67" fill="#8ea3d6">TWR <tspan fill="#f4f7ff">1.46</tspan></text>
    </g>
    <rect x="1470" y="48" width="28" height="28" rx="6" fill="#17245a"/><path d="M 1477 62 h 14" stroke="#8ea3d6" stroke-width="2.5"/>
    <rect x="1508" y="48" width="28" height="28" rx="6" fill="#17245a"/><path d="M 1515 55 l 14 14 M 1529 55 l -14 14" stroke="#8ea3d6" stroke-width="2.5"/>
  </g>

  <!-- tab bar -->
  <g font-size="17" font-weight="600" letter-spacing="1">
    <rect x="40" y="104" width="1520" height="52" rx="12" fill="#0c1538"/>
    <rect x="48" y="110" width="150" height="40" rx="9" fill="#1d2c66"/>
    <rect x="48" y="146" width="150" height="4" rx="2" fill="url(#gold)"/>
    <text x="123" y="137" text-anchor="middle" fill="#ffe29a">LIFT</text>
    <text x="283" y="137" text-anchor="middle" fill="#8ea3d6">ORBIT</text>
    <text x="443" y="137" text-anchor="middle" fill="#8ea3d6">TRANSFER</text>
    <text x="613" y="137" text-anchor="middle" fill="#8ea3d6">RENDEZVOUS</text>
    <text x="773" y="137" text-anchor="middle" fill="#8ea3d6">LAND</text>
    <text x="913" y="137" text-anchor="middle" fill="#8ea3d6">RETURN</text>
    <text x="1053" y="137" text-anchor="middle" fill="#8ea3d6">NODES</text>
    <text x="1500" y="137" text-anchor="end" fill="#5c6ea6" font-weight="400">SETTINGS</text>
  </g>

  <!-- left column: plan -->
  <g>
    <rect x="40" y="172" width="400" height="508" rx="14" fill="#0e1840" stroke="#1f2f66"/>
    <text x="64" y="208" font-size="14" fill="#8ea3d6" letter-spacing="2">MISSION PLAN</text>
    <g font-size="15">
      <rect x="64" y="224" width="352" height="40" rx="10" fill="#0a1230"/>
      <rect x="68" y="228" width="114" height="32" rx="8" fill="#1d2c66"/>
      <text x="125" y="249" text-anchor="middle" fill="#ffe29a">Orbit</text>
      <text x="240" y="249" text-anchor="middle" fill="#8ea3d6">Transfer</text>
      <text x="355" y="249" text-anchor="middle" fill="#8ea3d6">Rendezvous</text>
    </g>
    <g font-size="14">
      <text x="64" y="300" fill="#8ea3d6">Target altitude</text>
      <rect x="64" y="310" width="168" height="44" rx="10" fill="#0a1230" stroke="#24366e"/>
      <text x="80" y="339" font-size="20" fill="#f4f7ff">100</text><text x="214" y="339" text-anchor="end" fill="#5c6ea6">km</text>
      <text x="248" y="300" fill="#8ea3d6">Inclination</text>
      <rect x="248" y="310" width="168" height="44" rx="10" fill="#0a1230" stroke="#24366e"/>
      <text x="264" y="339" font-size="20" fill="#f4f7ff">0.0</text><text x="398" y="339" text-anchor="end" fill="#5c6ea6">°</text>
      <text x="64" y="388" fill="#8ea3d6">Gravity turn start</text>
      <text x="416" y="388" text-anchor="end" fill="#f4f7ff">1.2 km</text>
      <rect x="64" y="400" width="352" height="6" rx="3" fill="#1d2c66"/>
      <rect x="64" y="400" width="96" height="6" rx="3" fill="#7fe7ff"/>
      <circle cx="160" cy="403" r="10" fill="#f4f7ff" stroke="#7fe7ff" stroke-width="3"/>
      <text x="64" y="444" fill="#8ea3d6">Turn shape</text>
      <text x="416" y="444" text-anchor="end" fill="#f4f7ff">40 %</text>
      <rect x="64" y="456" width="352" height="6" rx="3" fill="#1d2c66"/>
      <rect x="64" y="456" width="141" height="6" rx="3" fill="#7fe7ff"/>
      <circle cx="205" cy="459" r="10" fill="#f4f7ff" stroke="#7fe7ff" stroke-width="3"/>
      <text x="64" y="500" fill="#8ea3d6">Max angle of attack</text>
      <text x="416" y="500" text-anchor="end" fill="#f4f7ff">5°</text>
      <rect x="64" y="512" width="352" height="6" rx="3" fill="#1d2c66"/>
      <rect x="64" y="512" width="70" height="6" rx="3" fill="#7fe7ff"/>
      <circle cx="134" cy="515" r="10" fill="#f4f7ff" stroke="#7fe7ff" stroke-width="3"/>
    </g>
    <g font-size="15" fill="#f4f7ff">
      <text x="64" y="568">Auto staging</text>
      <rect x="356" y="552" width="60" height="28" rx="14" fill="#d6f53c"/><circle cx="402" cy="566" r="11" fill="#0a1230"/>
      <text x="64" y="612">Warp to launch window</text>
      <rect x="356" y="596" width="60" height="28" rx="14" fill="#d6f53c"/><circle cx="402" cy="610" r="11" fill="#0a1230"/>
      <text x="64" y="656">Plan booster return</text>
      <rect x="356" y="640" width="60" height="28" rx="14" fill="#1d2c66"/><circle cx="370" cy="654" r="11" fill="#5c6ea6"/>
    </g>
  </g>

  <!-- centre: ascent profile -->
  <g>
    <rect x="456" y="172" width="704" height="508" rx="14" fill="url(#sky)" stroke="#1f2f66"/>
    <text x="480" y="208" font-size="14" fill="#8ea3d6" letter-spacing="2">ASCENT PROFILE</text>
    <text x="1136" y="208" font-size="13" fill="#5c6ea6" text-anchor="end">altitude / downrange</text>
    <g stroke="#7fe7ff" stroke-opacity="0.08">
      <line x1="500" y1="280" x2="1130" y2="280"/><line x1="500" y1="380" x2="1130" y2="380"/><line x1="500" y1="480" x2="1130" y2="480"/><line x1="500" y1="580" x2="1130" y2="580"/>
      <line x1="650" y1="240" x2="650" y2="620"/><line x1="800" y1="240" x2="800" y2="620"/><line x1="950" y1="240" x2="950" y2="620"/>
    </g>
    <g font-size="12" fill="#5c6ea6"><text x="492" y="284" text-anchor="end">100</text><text x="492" y="384" text-anchor="end">70</text><text x="492" y="484" text-anchor="end">35</text><text x="492" y="584" text-anchor="end">0</text></g>
    <line x1="500" y1="335" x2="1130" y2="335" stroke="#ff7a5a" stroke-opacity="0.5" stroke-dasharray="8 8"/>
    <text x="1126" y="328" font-size="12" text-anchor="end" fill="#ff9a7a">atmosphere 70 km</text>
    <path d="M 510 620 C 560 520, 640 380, 820 312 C 960 286, 1060 280, 1120 280 L 1120 620 Z" fill="url(#fill)"/>
    <path d="M 510 620 C 560 520, 640 380, 820 312 C 960 286, 1060 280, 1120 280" fill="none" stroke="#7fe7ff" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M 510 620 C 540 560, 580 490, 640 440" fill="none" stroke="#ffe29a" stroke-width="5"/>
    <g transform="translate(640 440) rotate(52)">
      <circle r="16" fill="#0a1230" stroke="#ffe29a" stroke-width="3"/>
      <path d="M -4 6 L -4 -6 Q 0 -13 4 -6 L 4 6 Z" fill="#ffffff"/>
    </g>
    <circle cx="1120" cy="280" r="7" fill="#e8a93a"/>
    <text x="1110" y="262" font-size="13" text-anchor="end" fill="#ffe29a">Ap 100 km</text>
    <rect x="500" y="620" width="630" height="3" fill="#3f9b52"/>
    <text x="510" y="646" font-size="12" fill="#5c6ea6">KSC Pad 1</text>
  </g>

  <!-- right column: telemetry -->
  <g>
    <rect x="1176" y="172" width="384" height="508" rx="14" fill="#0e1840" stroke="#1f2f66"/>
    <text x="1200" y="208" font-size="14" fill="#8ea3d6" letter-spacing="2">TELEMETRY</text>
    <g font-size="13" fill="#8ea3d6">
      <rect x="1200" y="224" width="160" height="92" rx="12" fill="#0a1230"/>
      <text x="1216" y="250">ALTITUDE</text><text x="1216" y="292" font-size="32" font-weight="600" fill="#f4f7ff">18.4</text><text x="1300" y="292" fill="#5c6ea6">km</text>
      <rect x="1376" y="224" width="160" height="92" rx="12" fill="#0a1230"/>
      <text x="1392" y="250">SPEED</text><text x="1392" y="292" font-size="32" font-weight="600" fill="#f4f7ff">742</text><text x="1462" y="292" fill="#5c6ea6">m/s</text>
      <rect x="1200" y="328" width="160" height="92" rx="12" fill="#0a1230"/>
      <text x="1216" y="354">APOAPSIS</text><text x="1216" y="396" font-size="32" font-weight="600" fill="#ffe29a">41.2</text><text x="1300" y="396" fill="#5c6ea6">km</text>
      <rect x="1376" y="328" width="160" height="92" rx="12" fill="#0a1230"/>
      <text x="1392" y="354">TIME TO AP</text><text x="1392" y="396" font-size="32" font-weight="600" fill="#f4f7ff">0:52</text>
    </g>
    <text x="1200" y="456" font-size="13" fill="#8ea3d6" letter-spacing="2">STAGES · Δv</text>
    <g font-size="13">
      <text x="1200" y="486" fill="#f4f7ff">S1 booster</text><text x="1536" y="486" text-anchor="end" fill="#8ea3d6">1 950 m/s</text>
      <rect x="1200" y="494" width="336" height="10" rx="5" fill="#1d2c66"/><rect x="1200" y="494" width="190" height="10" rx="5" fill="#e8a93a"/>
      <text x="1200" y="530" fill="#f4f7ff">S2 upper</text><text x="1536" y="530" text-anchor="end" fill="#8ea3d6">2 300 m/s</text>
      <rect x="1200" y="538" width="336" height="10" rx="5" fill="#1d2c66"/><rect x="1200" y="538" width="336" height="10" rx="5" fill="#7fe7ff"/>
      <text x="1200" y="574" fill="#f4f7ff">S3 lander</text><text x="1536" y="574" text-anchor="end" fill="#8ea3d6">562 m/s</text>
      <rect x="1200" y="582" width="336" height="10" rx="5" fill="#1d2c66"/><rect x="1200" y="582" width="82" height="10" rx="5" fill="#7fe7ff"/>
    </g>
    <rect x="1200" y="614" width="336" height="44" rx="10" fill="#132a1e" stroke="#3d6b2a"/>
    <circle cx="1222" cy="636" r="6" fill="#d6f53c"/>
    <text x="1238" y="641" font-size="14" fill="#d6f53c">Gravity turn on track · AoA 2.1°</text>
  </g>

  <!-- phase timeline -->
  <g font-size="14">
    <rect x="40" y="696" width="1520" height="80" rx="14" fill="#0e1840" stroke="#1f2f66"/>
    <line x1="120" y1="726" x2="1480" y2="726" stroke="#1d2c66" stroke-width="4"/>
    <line x1="120" y1="726" x2="660" y2="726" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="120" cy="726" r="12" fill="#e8a93a"/><text x="120" y="760" text-anchor="middle" fill="#ffe29a">Launch window</text>
    <circle cx="390" cy="726" r="12" fill="#e8a93a"/><text x="390" y="760" text-anchor="middle" fill="#ffe29a">Vertical climb</text>
    <circle cx="660" cy="726" r="15" fill="#0a1230" stroke="#ffe29a" stroke-width="4"/><circle cx="660" cy="726" r="6" fill="#ffe29a"/>
    <text x="660" y="760" text-anchor="middle" fill="#f4f7ff" font-weight="700">Gravity turn</text>
    <circle cx="930" cy="726" r="12" fill="#1d2c66"/><text x="930" y="760" text-anchor="middle" fill="#8ea3d6">Coast to Ap</text>
    <circle cx="1200" cy="726" r="12" fill="#1d2c66"/><text x="1200" y="760" text-anchor="middle" fill="#8ea3d6">Circularize</text>
    <circle cx="1480" cy="726" r="12" fill="#1d2c66"/><text x="1480" y="760" text-anchor="middle" fill="#8ea3d6">In orbit</text>
  </g>

  <!-- action bar -->
  <g font-size="17" font-weight="600">
    <text x="48" y="832" font-size="14" font-weight="400" fill="#8ea3d6">Next: coast at 41 km · stage 1 dry in 0:38</text>
    <rect x="1080" y="800" width="150" height="52" rx="12" fill="#17245a" stroke="#24366e"/>
    <text x="1155" y="832" text-anchor="middle" fill="#f4f7ff">Pause</text>
    <rect x="1246" y="800" width="150" height="52" rx="12" fill="#3a1a1a" stroke="#7a3030"/>
    <text x="1321" y="832" text-anchor="middle" fill="#ff9a7a">Abort</text>
    <rect x="1412" y="800" width="148" height="52" rx="12" fill="url(#gold)"/>
    <text x="1486" y="832" text-anchor="middle" fill="#1a1205">Running…</text>
  </g>
</svg>
