<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600">
  <defs>
    <radialGradient id="sky" cx="30%" cy="30%" r="90%">
      <stop offset="0" stop-color="#16245a"/>
      <stop offset="0.55" stop-color="#0a1233"/>
      <stop offset="1" stop-color="#03050f"/>
    </radialGradient>
    <radialGradient id="planet" cx="50%" cy="5%" r="70%">
      <stop offset="0" stop-color="#3fb6c9"/>
      <stop offset="0.45" stop-color="#1f6f9a"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe7ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fe7ff" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6e4"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa6bd"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.4" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb02e" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfefff"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="290" width="900" height="260" transform="rotate(-18 330 290)"/></clipPath>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="90" cy="70" r="3" opacity="0.8"/>
    <circle cx="250" cy="40" r="2" opacity="0.6"/>
    <circle cx="610" cy="60" r="2.5" opacity="0.7"/>
    <circle cx="820" cy="110" r="2" opacity="0.5"/>
    <circle cx="1010" cy="50" r="3" opacity="0.8"/>
    <circle cx="1240" cy="90" r="2" opacity="0.6"/>
    <circle cx="1450" cy="40" r="2.5" opacity="0.7"/>
    <circle cx="1530" cy="170" r="2" opacity="0.5"/>
    <circle cx="1370" cy="230" r="1.8" opacity="0.5"/>
    <circle cx="60" cy="300" r="2" opacity="0.5"/>
    <circle cx="700" cy="230" r="1.8" opacity="0.5"/>
  </g>

  <!-- planet horizon -->
  <ellipse cx="800" cy="1620" rx="1500" ry="1120" fill="url(#glow)"/>
  <ellipse cx="800" cy="1650" rx="1450" ry="1100" fill="url(#planet)"/>

  <!-- emblem: icon-1024.png composited here (left, 500 px) -->
  <!-- title -->
  <text x="640" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="104" font-weight="700"
        fill="url(#title)" letter-spacing="1">SkySpaceAgency</text>
  <text x="644" y="335" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="400"
        fill="#9fdcef">Fly further in KSP2 Redux</text>
  <rect x="644" y="365" width="120" height="5" rx="2.5" fill="#ffc861"/>
  <text x="644" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="600"
        fill="#d7e3f5" letter-spacing="2">LAUNCH · ORBIT · TRANSFER · RENDEZVOUS · DOCK · LAND</text>
</svg>
