<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="35%" r="75%">
      <stop offset="0" stop-color="#16245a"/>
      <stop offset="0.55" stop-color="#0a1233"/>
      <stop offset="1" stop-color="#03050f"/>
    </radialGradient>
    <radialGradient id="planet" cx="50%" cy="10%" r="80%">
      <stop offset="0" stop-color="#3fb6c9"/>
      <stop offset="0.45" stop-color="#1f6f9a"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe7ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fe7ff" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfd6e4"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa6bd"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.4" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb02e" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0.15"/>
    </linearGradient>
    <!-- lower half of the orbit ring (in front of the rocket), in the ring's own tilted frame -->
    <clipPath id="front"><rect x="0" y="470" width="1024" height="300" transform="rotate(-18 512 470)"/></clipPath>
    <clipPath id="badge"><rect x="0" y="0" width="1024" height="1024" rx="210"/></clipPath>
  </defs>

  <g clip-path="url(#badge)">
    <rect width="1024" height="1024" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="140" cy="150" r="4" opacity="0.9"/>
      <circle cx="260" cy="90" r="2.5" opacity="0.7"/>
      <circle cx="830" cy="130" r="3.5" opacity="0.85"/>
      <circle cx="900" cy="300" r="2.5" opacity="0.6"/>
      <circle cx="110" cy="380" r="2.5" opacity="0.6"/>
      <circle cx="700" cy="70" r="2" opacity="0.6"/>
      <circle cx="380" cy="200" r="2" opacity="0.5"/>
      <circle cx="930" cy="520" r="3" opacity="0.7"/>
      <circle cx="80" cy="580" r="2" opacity="0.5"/>
      <circle cx="610" cy="180" r="1.8" opacity="0.5"/>
    </g>

    <!-- planet and atmosphere -->
    <ellipse cx="512" cy="1420" rx="900" ry="640" fill="url(#glow)"/>
    <ellipse cx="512" cy="1440" rx="860" ry="620" fill="url(#planet)"/>

    <!-- orbit ring, back half -->
    <ellipse cx="512" cy="470" rx="420" ry="120" fill="none" stroke="url(#orbit)" stroke-width="14"
             transform="rotate(-18 512 470)"/>

    <!-- booster return trajectory (dashed) to the landing pad -->
    <path d="M 520 712 C 640 690, 770 720, 772 800 S 750 858, 738 862" fill="none"
          stroke="#7fe7ff" stroke-width="10" stroke-linecap="butt" stroke-dasharray="22 18"/>
    <!-- landing pad marker -->
    <g transform="translate(735 878)">
      <ellipse cx="0" cy="0" rx="46" ry="12" fill="none" stroke="#7fe7ff" stroke-width="7"/>
      <circle cx="0" cy="0" r="7" fill="#7fe7ff"/>
    </g>

    <!-- rocket -->
    <g transform="translate(512 520) rotate(18)">
      <path d="M -34 150 Q 0 330 34 150 Z" fill="url(#flame)"/>
      <path d="M -18 150 Q 0 250 18 150 Z" fill="#fffbe6" opacity="0.9"/>
      <path d="M -40 90 L -92 160 L -40 140 Z" fill="#ff7a1a"/>
      <path d="M 40 90 L 92 160 L 40 140 Z" fill="#e0621a"/>
      <path d="M -40 150 L -40 -120 Q -40 -230 0 -300 Q 40 -230 40 -120 L 40 150 Z" fill="url(#body)"/>
      <rect x="-40" y="10" width="80" height="16" fill="#1b2a52"/>
      <circle cx="0" cy="-130" r="22" fill="#1b2a52" stroke="#7fe7ff" stroke-width="7"/>
      <path d="M -26 150 L -34 172 L 34 172 L 26 150 Z" fill="#5d6a85"/>
    </g>

    <!-- orbit ring, front half (in front of the rocket) -->
    <g clip-path="url(#front)">
      <ellipse cx="512" cy="470" rx="420" ry="120" fill="none" stroke="url(#orbit)" stroke-width="14"
               transform="rotate(-18 512 470)"/>
    </g>
    <circle cx="905" cy="392" r="16" fill="#ffc861"/>
  </g>

  <!-- badge rim -->
  <rect x="6" y="6" width="1012" height="1012" rx="206" fill="none" stroke="#7fe7ff" stroke-opacity="0.35" stroke-width="12"/>
</svg>
